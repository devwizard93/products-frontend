<h1>Gestión de productos</h1>

<a routerLink="/products/new"> Crear Producto </a>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let product of products">
            <td>{{ product.id }}</td>
            <td>{{ product.name }}</td>
            <td>{{ product.price }}</td>
            <td>{{ product.stock }}</td>
            <td>
                <button [routerLink]="['/products/edit', product.id]">
                    Editar
                </button>
                <button (click) ="deleteProduct(product.id)">
                    Eliminar
                </button>
            </td>
        </tr>
    </tbody>

</table>

<h2>{{ productId !== null ? 'Editar producto' : 'Registrar producto' }}</h2>

<form (ngSubmit)="saveProduct()">
  <div>
    <label>Nombre:</label>
    <input type="text" name="name" [(ngModel)]="product.name">
  </div>

  <div>
    <label>Precio:</label>
    <input type="number" name="price" [(ngModel)]="product.price">
  </div>

  <div>
    <label>Stock:</label>
    <input type="number" name="stock" [(ngModel)]="product.stock">
  </div>

  <button type="submit">
    {{ productId !== null ? 'Actualizar Producto' : 'Guardar producto' }}
  </button>
</form>
